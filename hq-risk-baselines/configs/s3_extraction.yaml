scenario: s3
attack: extraction
attack_mode: label_only
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = number of label-only queries the attacker sends
intensities: [0, 10, 25, 50, 100, 250, 500, 1000]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
