scenario: s3
attack: transpiler
attack_mode: angle_drift
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = radians added to every RZ angle by a compromised transpiler pass
intensities: [0, 0.05, 0.1, 0.2, 0.4, 0.8]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
