scenario: s3
attack: noise
attack_mode: depolarizing_readout
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = depolarizing probability per gate = readout flip probability
intensities: [0, 0.005, 0.01, 0.02, 0.05, 0.1]
seeds: [0, 1, 2, 3, 4, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
