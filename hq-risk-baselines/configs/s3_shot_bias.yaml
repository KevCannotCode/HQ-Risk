scenario: s3
attack: shot_bias
attack_mode: forged_bitstring
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = fraction of each circuit's shots replaced by the forged bitstring
intensities: [0, 0.05, 0.1, 0.2, 0.3, 0.4]
seeds: [0, 1, 2, 3, 4, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119, 120]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
