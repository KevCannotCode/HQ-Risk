scenario: s3
attack: inversion
attack_mode: zeroth_order
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = probability queries per class
intensities: [0, 20, 100, 500, 2000]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
