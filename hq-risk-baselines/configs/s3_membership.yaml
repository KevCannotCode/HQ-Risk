scenario: s3
attack: membership
attack_mode: confidence_threshold
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = members and non-members the attacker already knows (each side), used to set the threshold
intensities: [0, 2, 5, 10, 20]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
