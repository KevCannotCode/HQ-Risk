scenario: s3
attack: circuit_tamper
attack_mode: rx_half_pi
model: quantum_net
datasets: [breast_cancer, wine]
# intensity = number of injected RX(pi/2) gates
intensities: [0, 1, 2, 4, 8, 16]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
