scenario: s3
attack: backdoor
attack_mode: trigger
model: quantum_net
datasets: [breast_cancer, digits, wine]
# intensity = fraction of training rows stamped with the trigger and relabelled to the target class
intensities: [0, 0.01, 0.02, 0.05, 0.1, 0.2]
seeds: [0, 1, 2, 3, 4]
quantum:
  n_qubits: 8
  shots: 256
  epochs: 30
  learning_rate: 0.05
  batch_size: 16
output: results/raw/runs.csv
